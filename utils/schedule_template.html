<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4F0;--card:#FFFFFF;--ink:#26241E;--muted:#7A766B;--line:#E6E3D8;--line2:#D9D5C7;
 --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
 --crit:#C0392B;--map-h:clamp(220px,18vw,360px);--map-pad:16px}   /* map height + vertical padding knobs */
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.page{padding:2px 0 12px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:10px;box-shadow:0 1px 2px rgba(38,36,30,.06)}
.lbl{font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* header: station name left · overall completion + compass right */
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:2px 0 12px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.badge{font:700 15px var(--mono);border:1px solid var(--line2);border-radius:10px;padding:12px;background:var(--card);box-shadow:0 1px 2px rgba(38,36,30,.06)}
h1{margin:0;font:600 22px/1.2 var(--sans);letter-spacing:-.01em;white-space:nowrap}
.hd-right{display:flex;gap:10px;align-items:stretch}
.overall{padding:9px 16px 11px;min-width:250px}
.overall .v{font:700 26px/1.1 var(--mono);margin:5px 0 8px}
.compass-card{display:flex;align-items:center;justify-content:center;padding:8px 16px}
.compass{width:64px;height:64px}

/* progress bars */
.pb{height:7px;background:#ECEAE0;border-radius:99px;position:relative}
.pb i{display:block;height:100%;border-radius:99px}
.pb b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#26241E;border-radius:1px}
.pb.sm{height:5px}.pb.sm b{top:-2px;bottom:-2px}

/* map */
.map{position:relative;margin-bottom:12px}
.map-top{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.frame{position:relative;height:var(--map-h);padding:var(--map-pad) 0;overflow:hidden;background:#fff;border-radius:0 0 10px 10px}
.canvas{position:relative;height:100%;line-height:0}
.canvas img{width:100%;height:100%;object-fit:fill;display:block}
.box{position:absolute;border:1.5px solid currentColor;border-radius:4px;cursor:pointer;z-index:2}
.box.crit{outline:1.5px dashed var(--crit);outline-offset:2px}
.box.on{box-shadow:0 0 0 1px #fff,0 0 0 3px currentColor;z-index:6}
.box.pin{border-width:3px;z-index:7}
.bchip{position:absolute;left:3px;top:3px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);
 border:1px solid var(--line2);border-radius:5px;padding:2px 6px;font:600 10px/1.25 var(--mono);white-space:nowrap;z-index:3}
.bchip b{font-weight:700}
/* label position per section — set "chip" in stations.json: tl tr bl br c */
.box.p-tr .bchip{left:auto;right:3px}
.box.p-bl .bchip{top:auto;bottom:3px}
.box.p-br .bchip{left:auto;right:3px;top:auto;bottom:3px}
.box.p-c  .bchip{left:50%;top:50%;transform:translate(-50%,-50%)}
.box.narrow .bchip{flex-direction:column;align-items:flex-start;gap:1px;padding:2px 4px;font-size:9px}
.box.narrow.p-c .bchip{align-items:center}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.tag{font:700 8px var(--mono);letter-spacing:.08em;color:#fff;background:var(--crit);border-radius:4px;padding:1.5px 5px;vertical-align:2px}
.tip{position:absolute;z-index:40;width:290px;padding:10px 12px;display:none;pointer-events:none;line-height:1.35}
.tip h4{margin:0;font:600 12.5px var(--sans)}
.tip .tlbl{font:500 9.5px var(--mono);color:var(--muted);margin:2px 0 4px}
.tip .tr{display:grid;grid-template-columns:10px minmax(0,1fr) 64px 32px;gap:7px;align-items:center;margin-top:5px;font:500 10.5px var(--sans)}
.tip .tr .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip .tr em{font:600 10px var(--mono);font-style:normal;text-align:right}
.tip .more{margin-top:6px;font:500 9px var(--mono);color:var(--muted)}

/* corridor cards */
.secs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:3px}
.scard{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .12s,box-shadow .12s}
.scard:hover{border-color:#AFaa99}
.scard.on{border-color:#26241E;box-shadow:inset 0 0 0 1px #26241E}
.scard .r1{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.scard .dot{width:9px;height:9px;border-radius:3px;flex:none}
.scard .code{font:600 11px var(--mono)}
.scard .pct{margin-left:auto;font:700 12.5px var(--mono)}
.scard .meta{display:flex;align-items:center;gap:5px;margin-top:6px;font:500 9px var(--mono);color:var(--muted)}

/* corridor-group summary (West / East / Road crossing) */
.grps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin:0 0 12px}
.gcard{background:var(--card);border:1px solid var(--line2);border-left:5px solid var(--gc);border-radius:10px;padding:9px 12px 10px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .12s,box-shadow .12s}
.gcard:hover{border-color:#AFaa99;border-left-color:var(--gc)}
.gcard.on{border-color:#26241E;border-left-color:var(--gc);box-shadow:inset 0 0 0 1px #26241E}
.gcard .r1{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.gcard .nm{font:600 12.5px var(--sans)}
.gcard .pct{margin-left:auto;font:700 18px var(--mono)}
.gcard .meta{display:flex;align-items:center;gap:5px;margin-top:7px;font:500 9.5px var(--mono);color:var(--muted);flex-wrap:wrap}
.box,.scard{transition:opacity .12s}
.dim{opacity:.28}
.srow{display:grid;grid-template-columns:minmax(110px,150px) minmax(120px,1fr) 70px 120px;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 16px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.srow:hover{background:#FBFAF6}
.srow:last-child{border-bottom:0}
.srow .nm{font:600 12px var(--mono);display:flex;align-items:center;gap:8px}
.srow .pv{font:700 12px var(--mono);text-align:right}
.sech{font:600 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 16px;background:#FBFAF6;border-bottom:1px solid var(--line)}

/* detail */
.detail{overflow:hidden}
.detail .ph{padding:26px 16px;text-align:center;font:500 12.5px var(--sans);color:var(--muted)}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;padding:12px 16px 4px;flex-wrap:wrap}
.dh h2{margin:0;font:600 17px var(--sans);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dh .sub{font:500 10px var(--mono);color:var(--muted);letter-spacing:.05em;margin-top:5px}
.dh .dr{display:flex;align-items:center;gap:12px}
.dh .pc{font:700 24px/1 var(--mono);text-align:right}
.dh .pc small{display:block;font:500 9px var(--mono);color:var(--muted);letter-spacing:.08em;margin-top:3px}
.clx{font:600 10px var(--mono);border:1px solid var(--line2);background:#fff;border-radius:99px;padding:4px 11px;cursor:pointer;color:#57534A}
.clx:hover{border-color:#26241E;color:#26241E}
.dbar{padding:8px 16px 12px;border-bottom:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 9px var(--mono);letter-spacing:.05em;text-transform:uppercase;border:1px solid;border-radius:99px;padding:2px 8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.dot.lg{width:13px;height:13px}
table{width:100%;border-collapse:collapse}
th{font:600 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 16px;background:#FBFAF6;border-bottom:1px solid var(--line)}
td{padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.ag{font-weight:600;white-space:nowrap}
td.ag .dot{margin-right:8px;vertical-align:-1px}
td.dts{font:500 10.5px var(--mono);color:#57534A;white-space:nowrap}
td.dts small{display:block;color:var(--muted);font-size:9.5px;margin-top:2px}
td.pr{min-width:190px}
td.pr .n{font:600 11px var(--mono);margin-bottom:4px}
.rm{color:var(--crit);font-size:11px;margin-top:3px}
@media(max-width:900px){h1{font-size:18px}}
</style>

<div class="page" id="page">
  <div class="top">
    <div class="brand">
      <div class="badge" id="badge"></div>
      <h1 id="title"></h1>
    </div>
    <div class="hd-right">
      <div class="card overall">
        <div class="lbl">Overall completion</div>
        <div class="v" id="ovv"></div>
        <div id="ovbar"></div>
      </div>
      <div class="card compass-card">
        <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="44" fill="#fff" stroke="#26241E" stroke-width="3"/>
          <text x="50" y="27" font-size="22" font-family="monospace" font-weight="700" text-anchor="middle">W</text>
          <text x="82" y="58" font-size="22" font-family="monospace" font-weight="700" text-anchor="middle">N</text>
          <text x="50" y="88" font-size="22" font-family="monospace" font-weight="700" text-anchor="middle">E</text>
          <text x="18" y="58" font-size="22" font-family="monospace" font-weight="700" text-anchor="middle">S</text>
          <polygon points="50,46 50,54 70,50" fill="#26241E"/><circle cx="50" cy="50" r="2.5" fill="#26241E"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="grps" id="grps"></div>

  <div class="card map" id="mapcard">
    <div class="map-top"><span class="lbl">Corridor schematic</span></div>
    <div class="frame" id="frame">
      <div class="canvas" id="canvas"><img id="img" alt="station corridor"></div>
    </div>
    <div class="card tip" id="tip"></div>
  </div>

  <div class="secs" id="secs"></div>
  <div class="card detail" id="detail"></div>
</div>

<script>
const P = __DATA__;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const SC = P.status;
const keys = Object.keys(P.boxes);
let hover = null;
let pinned = P.defaultSection;      // Section-1 open by default on first load
let shown = null;                   // what the detail panel currently shows (section key or 'g:<group>')
let gpin = null, ghover = null;     // corridor group (West / East / Road crossing): clicked / hovered
const G = {}; (P.groups || []).forEach(g => G[g.name] = g);

const sec = k => P.sections[k] || {actual:0, planned:0, status:'Not started', tasks:[], start:'—', end:'—'};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n>>16&255) + ',' + (n>>8&255) + ',' + (n&255) + ',' + a + ')'; };
const bar = (a, p, c, cls) => '<div class="pb ' + (cls||'') + '"><i style="width:' + a + '%;background:' + c + '"></i>'
  + (p == null ? '' : '<b style="left:' + p + '%"></b>') + '</div>';
const pill = s => '<span class="pill" style="color:' + SC[s] + ';border-color:' + SC[s] + '66;background:' + SC[s] + '14">' + s + '</span>';

/* header */
 $('#badge').textContent = P.code;
 $('#title').textContent = P.title;
 $('#ovv').textContent = P.overall.toFixed(1) + '%';
 $('#ovbar').innerHTML = bar(P.overall, null, '#2E7D46');

/* map */
 $('#img').src = P.image;
const canvas = $('#canvas'), frame = $('#frame'), tip = $('#tip'), mapcard = $('#mapcard');
keys.forEach(key => {
  const b = P.boxes[key], s = sec(key), c = b.color;
  const el = document.createElement('div');
  el.className = 'box p-' + (b.chip || 'tl') + (b.critical ? ' crit' : '') + (b.w < 8 ? ' narrow' : '');
  el.dataset.k = key;
  el.style.color = c;
  el.style.left = b.x + '%'; el.style.top = b.y + '%';
  el.style.width = b.w + '%'; el.style.height = b.h + '%';
  el.style.background = 'linear-gradient(90deg,' + rgba(c,.2) + ' ' + s.actual + '%,' + rgba(c,.05) + ' ' + s.actual + '%)';   // light fill (progress shade)
  el.innerHTML = `<span class="bchip"><span class="st" style="background:${SC[s.status]}"></span>${b.short}<b>${Math.round(s.actual)}%</b></span>`;
  el.onmouseenter = () => { hover = key; refresh(); showTip(key); };
  el.onmousemove = ev => moveTip(ev);
  el.onmouseleave = () => { hover = null; tip.style.display = 'none'; refresh(); };
  el.onclick = ev => { ev.stopPropagation(); gpin = null; pinned = (pinned === key ? null : key); refresh(); };
  canvas.appendChild(el);
});
frame.onclick = () => { pinned = null; gpin = null; refresh(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { pinned = null; gpin = null; refresh(); } });

function showTip(key) {
  const s = sec(key), b = P.boxes[key];
  let h = `<h4>${esc(b.label)}${b.critical ? ' <span class="tag">CRITICAL</span>' : ''}</h4>`
        + `<div class="tlbl">${Math.round(s.actual)}% · ${s.status}</div>`;
  const rows = s.tip || s.tasks;                 // one row per utility (sizes / voltages combined)
  rows.slice(0, 10).forEach(t => {
    h += `<div class="tr"><i class="dot" style="background:${t.color}"></i><span class="n">${esc(t.name || t.agency)}</span>${bar(t.actual, t.planned, t.color, 'sm')}<em>${t.actual}%</em></div>`;
  });
  const extra = rows.length > 10 ? `+ ${rows.length - 10} more · ` : '';
  h += `<div class="more">${extra}click to open the full work list</div>`;
  tip.innerHTML = h; tip.style.display = 'block';
}
function moveTip(ev) {
  const r = mapcard.getBoundingClientRect(), w = tip.offsetWidth;
  let x = ev.clientX - r.left + 16, y = ev.clientY - r.top + 14;
  if (x + w > r.width - 6) x = ev.clientX - r.left - w - 16;
  tip.style.left = Math.max(6, x) + 'px'; tip.style.top = y + 'px';
}

/* corridor cards */
 $('#secs').innerHTML = keys.map(key => {
  const b = P.boxes[key], s = sec(key);
  return `<button class="scard" data-k="${key}">
    <div class="r1"><span class="dot" style="background:${b.color}"></span><span class="code">${key}</span>
      ${b.critical ? '<span class="tag">CRIT</span>' : ''}
      <span class="pct" style="color:${s.status === 'Delayed' ? SC.Delayed : 'inherit'}">${Math.round(s.actual)}%</span></div>
    <div class="pb sm"><i style="width:${s.actual}%;background:${b.color}"></i><b style="left:${s.planned}%"></b></div>
    <div class="meta"><span class="st" style="background:${SC[s.status]}"></span>${s.start} → ${s.end.replace(/ \d{4}$/,'')}</div>
  </button>`;
}).join('');
 $$('.scard').forEach(el => {
  el.onmouseenter = () => { hover = el.dataset.k; refresh(); };
  el.onmouseleave = () => { hover = null; refresh(); };
  el.onclick = () => { gpin = null; pinned = (pinned === el.dataset.k ? null : el.dataset.k); refresh(); };
});

/* corridor-group cards */
 $('#grps').innerHTML = (P.groups || []).map(g => `<button class="gcard" data-g="${esc(g.name)}" style="--gc:${g.color}">
    <div class="r1"><span class="nm">${esc(g.name)}</span><span class="pct" style="color:${g.status === 'Delayed' ? SC.Delayed : 'inherit'}">${g.actual.toFixed(1)}%</span></div>
    ${bar(g.actual, g.planned, g.color)}
    <div class="meta"><span class="st" style="background:${SC[g.status]}"></span>${g.status} · plan ${Math.round(g.planned)}% · ${g.sections.map(k => (P.boxes[k] || {}).short || k).join(' ')}</div>
  </button>`).join('');
 $$('.gcard').forEach(el => {
  el.onmouseenter = () => { ghover = el.dataset.g; refresh(); };
  el.onmouseleave = () => { ghover = null; refresh(); };
  el.onclick = () => { pinned = null; gpin = (gpin === el.dataset.g ? null : el.dataset.g); refresh(); };
});

/* detail panel for a corridor group: utility-wise roll-up + its sections */
function renderGroup(name) {
  const g = G[name];
  $('#detail').innerHTML = `
  <div class="dh">
    <div><h2><span class="dot lg" style="background:${g.color}"></span>${esc(g.name)} ${pill(g.status)}</h2>
      <div class="sub">${g.sections.map(esc).join(' + ').toUpperCase()} · ${g.start} → ${g.end}</div></div>
    <div class="dr">
      <div class="pc">${g.actual.toFixed(1)}%<small>PLAN ${Math.round(g.planned)}%</small></div>
      <button class="clx" id="clx">✕ close</button>
    </div>
  </div>
  <div class="dbar">${bar(g.actual, g.planned, SC[g.status])}</div>
  <div class="sech">Sections</div>
  ${g.sections.map(k => { const s = sec(k), b = P.boxes[k] || {color:'#888'}; return `<button class="srow" data-open="${esc(k)}">
      <span class="nm"><i class="dot" style="background:${b.color}"></i>${esc(k)}</span>
      ${bar(s.actual, s.planned, b.color, 'sm')}
      <span class="pv">${Math.round(s.actual)}%</span><span>${pill(s.status)}</span></button>`; }).join('')}
  <div class="sech">Utility-wise (all sizes / voltages combined)</div>
  ${(g.tip || []).map(t => `<div class="srow" style="cursor:default">
      <span class="nm"><i class="dot" style="background:${t.color}"></i>${esc(t.name)}</span>
      ${bar(t.actual, t.planned, t.color, 'sm')}
      <span class="pv">${t.actual}%</span><span>${pill(t.status)}</span></div>`).join('')}`;
  $$('[data-open]').forEach(el => el.onclick = () => { gpin = null; pinned = el.dataset.open; refresh(); });
  const x = document.getElementById('clx');
  if (x) x.onclick = () => { pinned = null; gpin = null; refresh(); };
}

/* detail panel — rendered for the CLICKED (pinned) corridor */
function renderDetail(key) {
  const s = sec(key), b = P.boxes[key];
  $('#detail').innerHTML = `
  <div class="dh">
    <div><h2><span class="dot lg" style="background:${b.color}"></span>${esc(b.label)}${b.critical ? ' <span class="tag">CRITICAL</span>' : ''} ${pill(s.status)}</h2>
      <div class="sub">${esc((b.group || '').toUpperCase())} · ${s.start} → ${s.end}</div></div>
    <div class="dr">
      <div class="pc">${Math.round(s.actual)}%<small>PLAN ${Math.round(s.planned)}%</small></div>
      <button class="clx" id="clx">✕ close</button>
    </div>
  </div>
  <div class="dbar">${bar(s.actual, s.planned, SC[s.status])}</div>
  <div style="overflow-x:auto"><table>
    <tr><th>Agency</th><th>Work</th><th>Weight</th><th>Schedule</th><th>Progress</th><th>Status</th></tr>
    ${(s.tasks || []).map(t => `<tr>
      <td class="ag"><i class="dot" style="background:${t.color}"></i>${esc(t.org || t.agency)}</td>
      <td>${esc(t.desc)}${t.remarks ? `<div class="rm">⚠ ${esc(t.remarks)}</div>` : ''}</td>
      <td class="dts">×${t.weight}<small>${t.wlen} lm</small></td>
      <td class="dts">${t.start} → ${t.end}<small>${t.days} days</small></td>
      <td class="pr"><div class="n">${t.actual}%</div>${bar(t.actual, t.planned, t.color, 'sm')}</td>
      <td>${pill(t.status)}</td></tr>`).join('')}
  </table></div>`;
  const x = document.getElementById('clx');
  if (x) x.onclick = () => { pinned = null; gpin = null; refresh(); };
}
function renderPlaceholder() {
  $('#detail').innerHTML = '<div class="ph">Click a corridor on the schematic — or a card above — to open its agency-wise work list. Click West / East / Road crossing for the whole corridor.</div>';
}

/* state */
function refresh() {
  const want = gpin ? 'g:' + gpin : pinned;
  if (want !== shown) {                       // redraw the detail panel only when the selection changes
    if (gpin) renderGroup(gpin); else if (pinned) renderDetail(pinned); else renderPlaceholder();
    shown = want;
  }
  // corridor group (West/East/Road) active? -> highlight its sections, fade the others
  const gname = ghover || (hover ? null : gpin);
  const mem = gname && G[gname] ? G[gname].sections : null;
  const key = hover || pinned;                // hover = soft highlight, pinned = full highlight
  $$('.box,.scard').forEach(el => {
    const k = el.dataset.k;
    el.classList.toggle('on', mem ? mem.includes(k) : k === key);
    el.classList.toggle('dim', !!mem && !mem.includes(k));
  });
  $$('.box').forEach(el => el.classList.toggle('pin', !mem && el.dataset.k === pinned));
  $$('.gcard').forEach(el => el.classList.toggle('on', el.dataset.g === gpin));
  fit();
}

/* auto-size the iframe to its content */
function fit() {
  try { window.frameElement.style.height = ($('#page').offsetHeight + 14) + 'px'; } catch (e) {}
}
window.addEventListener('resize', fit);
window.addEventListener('load', fit);
 $('#img').addEventListener('load', fit);
try { new ResizeObserver(fit).observe($('#page')); } catch (e) {}
refresh(); setTimeout(fit, 300); setTimeout(fit, 900);
</script>
