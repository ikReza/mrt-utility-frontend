<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRT Route — Dark Ops Schematic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060d;
    --ink:#e9f6ff;
    --muted:#7b86b8;
    --line-a:#00f0ff;
    --line-b:#ff2e9a;
    --line-c:#ffcc33;
    --done:#2bff88;
    --pending:#ff2e9a;
    --struct:#3c4677;
    --grid:rgba(0,240,255,0.045);
    --tag-bg:rgba(9,14,32,.88);
    --tag-border:rgba(0,240,255,.22);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; padding:26px 18px 46px;
    font-family:'JetBrains Mono','Fira Code',monospace;
    background:
      radial-gradient(1100px 700px at 75% -10%, rgba(0,240,255,.07), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(255,46,154,.06), transparent 60%),
      var(--bg);
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none;
    background:
      linear-gradient(rgba(0,240,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,.03) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
            mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
  }

  /* ---------- stage / HUD ---------- */
  #stage{
    position:relative; max-width:964px; margin:0 auto;
    background:linear-gradient(180deg,#070c1a 0%, #05080f 100%);
    border:1px solid rgba(0,240,255,.16); border-radius:12px;
    box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 0 46px rgba(0,240,255,.08), 0 24px 70px rgba(0,0,0,.55);
    overflow:hidden;
  }
  .corner{position:absolute; width:18px; height:18px; border:1.5px solid rgba(0,240,255,.7); pointer-events:none; z-index:5;}
  .corner.tl{top:7px; left:7px; border-right:none; border-bottom:none;}
  .corner.tr{top:7px; right:7px; border-left:none; border-bottom:none;}
  .corner.bl{bottom:7px; left:7px; border-right:none; border-top:none;}
  .corner.br{bottom:7px; right:7px; border-left:none; border-top:none;}

  .hud-bar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:11px 18px; border-bottom:1px solid rgba(0,240,255,.16);
    background:linear-gradient(90deg, rgba(0,240,255,.05), transparent 30%, transparent 70%, rgba(255,46,154,.05));
    font-family:'Orbitron',monospace; font-size:10px; letter-spacing:2px; color:var(--muted);
  }
  .led{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--done);
       box-shadow:0 0 8px var(--done); margin-right:9px; animation:ledBlink 2.4s infinite;}
  @keyframes ledBlink{0%,86%{opacity:1} 92%,100%{opacity:.25}}
  #readout{flex:1; text-align:center; min-width:220px; font-size:11px; letter-spacing:1.6px; color:var(--line-a);}
  #readout[data-mode="move"]{color:var(--line-a);}
  #readout[data-mode="dwell"]{color:var(--done);}
  #readout[data-mode="boot"]{color:var(--line-c);}
  #readout::after{content:'▍'; margin-left:6px; opacity:.7; animation:curBlink 1s steps(1) infinite;}
  @keyframes curBlink{50%{opacity:0}}
  .hud-clock{color:var(--muted);}

  .hud-progress{height:3px; background:rgba(0,240,255,.08);}
  #hudProgress{height:100%; width:0;
    background:linear-gradient(90deg,var(--line-a),var(--line-b));
    box-shadow:0 0 10px rgba(0,240,255,.6);}

  #svgHolder{padding:8px 0 4px;}
  #map{display:block; width:900px; max-width:100%; height:auto; margin:0 auto;}

  /* ---------- overlays ---------- */
  .scanlines{position:absolute; inset:0; pointer-events:none; z-index:4; mix-blend-mode:overlay;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);}

  /* ---------- SVG text ---------- */
  #map text{font-family:'JetBrains Mono','Fira Code',monospace;}
  .title-main{font-family:'Orbitron',monospace; font-size:21px; font-weight:900; fill:var(--ink); letter-spacing:5px;}
  .title-sub{font-size:10px; fill:var(--muted); letter-spacing:2.5px;}
  .st-label{font-size:12.5px; font-weight:600; fill:var(--ink); letter-spacing:.2px;}
  .st-id{font-family:'Orbitron',monospace; font-size:10.5px; font-weight:800; letter-spacing:1px;}
  .cp-label{font-family:'Orbitron',monospace; font-size:11px; font-weight:700; fill:var(--muted); letter-spacing:3px;}
  .shaft-label{font-family:'Orbitron',monospace; font-size:9px; font-weight:700; fill:var(--muted); letter-spacing:2px;}
  .legend-text{font-size:10px; fill:var(--muted); letter-spacing:1px;}
  .legend-box{fill:rgba(8,14,32,.82); stroke:rgba(0,240,255,.2);}
  .idx{font-size:8px; fill:#57608f; letter-spacing:1px;}

  /* ---------- route ---------- */
  .route-glow{fill:none; stroke:url(#lineGrad); stroke-width:13; opacity:.22; filter:blur(7px); pointer-events:none;}
  #ticks line{stroke:rgba(0,240,255,.15); stroke-width:1.3;}
  .flow{fill:none; stroke-width:2; stroke-linecap:round; mix-blend-mode:screen; pointer-events:none;}
  .flow-a{stroke:var(--line-a); stroke-dasharray:3 22; opacity:.5;  animation:flowA 2.8s linear infinite;}
  .flow-b{stroke:var(--line-b); stroke-dasharray:2 18; opacity:.32; animation:flowB 3.6s linear infinite;}
  @keyframes flowA{to{stroke-dashoffset:-125}}
  @keyframes flowB{to{stroke-dashoffset: 120}}
  .connector{stroke:#313a66; stroke-width:1; stroke-dasharray:2 4; opacity:.75; animation:conn 26s linear infinite;}
  @keyframes conn{to{stroke-dashoffset:-144}}
  .tag{fill:var(--tag-bg); stroke:var(--tag-border);}

  /* ---------- stations ---------- */
  .station{transition:filter .35s;}
  .station.active{filter:drop-shadow(0 0 7px currentColor) drop-shadow(0 0 2px currentColor);}
  .orbit{fill:none; stroke-width:1.1; stroke-dasharray:3 6; opacity:.4;
    transform-box:fill-box; transform-origin:center; animation:spin 16s linear infinite;}
  .station.active .orbit{opacity:.95; animation-duration:3s;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ping{fill:none; stroke-width:2; opacity:0;}

  /* ---------- train ---------- */
  #train{opacity:0; transition:opacity .4s;}
  #train.on{opacity:1;}
  #train .t-halo{opacity:.55; transition:opacity .4s;}
  #train .t-trail{opacity:0; transition:opacity .35s;}
  #train .t-beam{opacity:0; transition:opacity .35s;}
  #train .t-body{fill:#0b1326; stroke:#8feaff; stroke-width:1.5;}
  #train .t-window{fill:rgba(0,240,255,.6);}
  #train .t-cab{fill:#0f2c3f; stroke:rgba(143,234,255,.6); stroke-width:.9; opacity:.75; transition:fill .3s, opacity .3s;}
  #train .t-hl{fill:#274066; opacity:.5; transition:fill .3s, opacity .3s;}
  #train .t-door{fill:var(--done); opacity:0; transition:opacity .25s;}
  #train.moving .t-cab{fill:#d8ffff; opacity:1;}
  #train.moving .t-hl{fill:#ffffff; opacity:1;}
  #train.moving .t-beam{opacity:.22;}
  #train.moving .t-trail{opacity:.6;}
  #train.dwell .t-cab{fill:#9fe8ff; opacity:.9;}
  #train.dwell .t-hl{fill:#bfefff; opacity:.7;}
  #train.dwell .t-beam{opacity:0;}
  #train.dwell .t-trail{opacity:0;}
  #train.dwell .t-halo{opacity:.95; animation:haloPulse 1.1s ease-in-out infinite;}
  #train.dwell .t-door{opacity:.95;}
  @keyframes haloPulse{50%{opacity:.4}}
</style>
</head>
<body>

<div id="stage">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>

  <div class="hud-bar">
    <div><span class="led"></span>MRT OPS · CONTROL</div>
    <div id="readout" data-mode="boot">INITIALIZING SCHEMATIC…</div>
    <div class="hud-clock" id="hudClock">T+00:00:00</div>
  </div>
  <div class="hud-progress"><div id="hudProgress"></div></div>

  <div id="svgHolder"></div>

  <div class="scanlines"></div>
</div>

<script>
/* ============================================================
   EDIT ONLY THIS SECTION TO REUSE THE TEMPLATE FOR A NEW MAP
   ============================================================ */

const ROUTE_TITLE  = "AIRPORT ROUTE";
const ROUTE_LENGTH = "15k531m000";   // "NNkNNNm" → shown as "NN.NNN KM"

// Stations TOP -> BOTTOM. cp = contract package group, completed = green hex.
const DATA = [
  { id:"S12", name:"Airport sta.",              cp:"CP06", completed:true  },
  { id:"S11", name:"Airport Terminal-3 sta.",    cp:"CP06", completed:true  },
  { id:"S10", name:"Khilkhet sta.",              cp:"CP06", completed:true  },
  { id:"S09", name:"Nadda sta.",                 cp:"CP05", completed:false },
  { id:"S08", name:"Natun Bazar sta.",           cp:"CP04", completed:false },
  { id:"S07", name:"North Badda sta.",           cp:"CP04", completed:false },
  { id:"S06", name:"Badda sta.",                 cp:"CP04", completed:false },
  { id:"S05", name:"Aftab Nagar sta.",           cp:"CP04", completed:false },
  { id:"S04", name:"Rampura sta.",               cp:"CP03", completed:false },
  { id:"S03", name:"Malibagh sta.",              cp:"CP03", completed:false },
  { id:"S02", name:"Rajarbagh sta.",             cp:"CP03", completed:false },
  { id:"S01", name:"Kamlapur sta.",              cp:"CP03", completed:false },
];

// Route bends: t = fraction of vertical span, offset = px shift from center line.
const SHAPE_POINTS = [
  { t:0.0000, offset: -135.2 },
  { t:0.1372, offset:  -22.2 },
  { t:0.2200, offset:   10.0 },
  { t:0.2600, offset:   22.0 },
  { t:0.3000, offset:   -5.0 },
  { t:0.5152, offset:   34.8 },
  { t:0.6442, offset:   36.2 },
  { t:0.7913, offset:  -65.8 },
  { t:0.8398, offset:  -83.8 },
  { t:0.9260, offset:   10.2 },
  { t:1.0000, offset:   25.8 },
];
const CORNER_RADIUS = 26;

const SHOW_LAUNCHING_SHAFTS = true;

// --- animation toggles ---
const ENABLE_FLOW        = true;  // bidirectional energy dashes on the line
const ENABLE_TICKS       = true;  // track sleepers along the path
const ENABLE_ORBITS      = true;  // rotating dashed ring per station
const TRAIN_SPEED_PX_S   = 125;   // cruise speed along the path
const STATION_DWELL_S    = 0.9;   // stop time at each station

/* ============================================================
   RENDER ENGINE — no need to edit below this line
   ============================================================ */

const ROW_H = 78, TOP_PAD = 132, BOTTOM_PAD = 112, SHAFT_INSET = 44;
const LEFT_AXIS_X = 60, CP_AXIS_X = 128, LABEL_X = 196, LINE_X = 620, WIDTH = 900;
const RAIL_X = WIDTH - 34;

const n = DATA.length;
const H = TOP_PAD + (n-1)*ROW_H + BOTTOM_PAD;
const cps = [...new Set(DATA.map(d=>d.cp))];
const cpLabel = cps.length>1 ? `${cps[0]}–${cps[cps.length-1]}` : cps[0];

function yOf(i){ return TOP_PAD + i*ROW_H; }
function prettyLen(s){ const m=/^(\d+)k(\d+)m/.exec(s); return m?`${m[1]}.${m[2]} KM`:s; }
function hex(cx,cy,r){
  const pts=[];
  for(let k=0;k<6;k++){
    const a=(Math.PI/180)*(60*k-30);
    pts.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(' ');
}
function groupByCP(data){
  const groups=[]; let cur=null;
  data.forEach((d,i)=>{
    if(!cur||cur.cp!==d.cp){ cur={cp:d.cp,start:i,end:i}; groups.push(cur); }
    else cur.end=i;
  });
  return groups;
}
function shapeVertices(topY,botY){
  return SHAPE_POINTS.map(p=>({x:LINE_X+p.offset, y:topY+p.t*(botY-topY)}));
}
function roundedPolylinePath(points,radius){
  if(points.length<2) return "";
  const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
  const along=(from,to,d)=>{
    const len=dist(from,to); if(len===0) return {x:from.x,y:from.y};
    return {x:from.x+(to.x-from.x)/len*d, y:from.y+(to.y-from.y)/len*d};
  };
  let d=`M ${points[0].x} ${points[0].y} `;
  for(let i=1;i<points.length-1;i++){
    const p0=points[i-1],p1=points[i],p2=points[i+1];
    const r1=Math.min(radius,dist(p0,p1)/2), r2=Math.min(radius,dist(p1,p2)/2);
    const a=along(p1,p0,r1), b=along(p1,p2,r2);
    d+=`L ${a.x} ${a.y} Q ${p1.x} ${p1.y} ${b.x} ${b.y} `;
  }
  const last=points[points.length-1];
  return d+`L ${last.x} ${last.y}`;
}
function xAtY(vertices,y){
  for(let i=0;i<vertices.length-1;i++){
    const a=vertices[i], b=vertices[i+1];
    if(y>=a.y&&y<=b.y){
      const f=(b.y-a.y)===0?0:(y-a.y)/(b.y-a.y);
      return a.x+(b.x-a.x)*f;
    }
  }
  return vertices[vertices.length-1].x;
}
function buildBracket(x,y1,y2,label){
  const arrow=7, labelX=x-12, c="var(--struct)";
  let out=`<g stroke="${c}" stroke-width="1.3">`;
  out+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>`;
  out+=`<line x1="${x-arrow}" y1="${y1+arrow}" x2="${x}" y2="${y1}"/><line x1="${x+arrow}" y1="${y1+arrow}" x2="${x}" y2="${y1}"/>`;
  out+=`<line x1="${x-arrow}" y1="${y2-arrow}" x2="${x}" y2="${y2}"/><line x1="${x+arrow}" y1="${y2-arrow}" x2="${x}" y2="${y2}"/>`;
  out+=`<line x1="${x-10}" y1="${y1}" x2="${x+10}" y2="${y1}"/><line x1="${x-10}" y1="${y2}" x2="${x+10}" y2="${y2}"/>`;
  out+=`</g>`;
  const midY=(y1+y2)/2;
  out+=`<text class="cp-label" x="${labelX}" y="${midY}" text-anchor="middle" transform="rotate(-90 ${labelX} ${midY})">${label}</text>`;
  return out;
}

function render(){
  const cpGroups=groupByCP(DATA);
  const topEndY=SHOW_LAUNCHING_SHAFTS?TOP_PAD-SHAFT_INSET:yOf(0)-20;
  const botEndY=SHOW_LAUNCHING_SHAFTS?H-(BOTTOM_PAD-SHAFT_INSET):yOf(n-1)+20;
  const vertices=shapeVertices(topEndY,botEndY);
  const pathD=roundedPolylinePath(vertices,CORNER_RADIUS);

  let defs=`<defs>
    <pattern id="shaftHatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#233055"/>
    </pattern>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#00f0ff"/>
      <stop offset="55%" stop-color="#ff2e9a"/>
      <stop offset="100%" stop-color="#ffcc33"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.66" cy="0.42" r="0.8">
      <stop offset="0%" stop-color="rgba(0,240,255,0.075)"/>
      <stop offset="60%" stop-color="rgba(0,240,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(0,240,255,0)"/>
    </radialGradient>
    <radialGradient id="trainGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(0,240,255,0.5)"/>
      <stop offset="70%" stop-color="rgba(0,240,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,240,255,0)"/>
    </radialGradient>
    <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,240,255,0)"/>
      <stop offset="100%" stop-color="rgba(0,240,255,0.55)"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(190,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(190,255,255,0)"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;

  let out=`<svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${WIDTH} ${H}">`;
  out+=defs;

  // ambient background
  out+=`<rect x="0" y="0" width="${WIDTH}" height="${H}" fill="url(#bgGlow)"/>`;
  for(let y=0;y<=H;y+=48) out+=`<line x1="0" y1="${y}" x2="${WIDTH}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
  for(let x=0;x<=WIDTH;x+=75) out+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="rgba(0,240,255,0.03)" stroke-width="1"/>`;

  // title block (top-left)
  out+=`<text class="title-main" x="30" y="42">${ROUTE_TITLE}</text>`;
  out+=`<rect x="31" y="50" width="52" height="2.5" fill="var(--line-a)" opacity=".85"/>`;
  out+=`<rect x="87" y="50" width="10" height="2.5" fill="var(--line-b)" opacity=".85"/>`;
  out+=`<text class="title-sub" x="30" y="68">MRT SCHEMATIC · ${cpLabel} · ${n} STATIONS · ${prettyLen(ROUTE_LENGTH)}</text>`;

  // legend (top-right) — Completed / Pending
  out+=`<g transform="translate(${WIDTH-132} 14)">
    <rect class="legend-box" width="118" height="46" rx="6"/>
    <circle cx="17" cy="16" r="4.5" fill="var(--done)"/>
    <text class="legend-text" x="29" y="20">Completed</text>
    <circle cx="17" cy="34" r="4.5" fill="var(--pending)"/>
    <text class="legend-text" x="29" y="38">Pending</text>
  </g>`;

  // brackets
  out+=buildBracket(LEFT_AXIS_X, topEndY, botEndY, `${ROUTE_TITLE} · ${prettyLen(ROUTE_LENGTH)}`);
  cpGroups.forEach(g=>{
    out+=buildBracket(CP_AXIS_X, yOf(g.start)-ROW_H/2, yOf(g.end)+ROW_H/2, g.cp);
  });

  // launching shafts
  if(SHOW_LAUNCHING_SHAFTS){
    const shaftW=46,shaftH=10;
    const topX=xAtY(vertices,topEndY), botX=xAtY(vertices,botEndY);
    out+=`<rect x="${topX-shaftW/2}" y="${topEndY-5}" width="${shaftW}" height="${shaftH}" fill="url(#shaftHatch)" stroke="var(--struct)"/>`;
    out+=`<text class="shaft-label" x="${topX+shaftW/2+12}" y="${topEndY+3.5}">LAUNCHING SHAFT</text>`;
    out+=`<rect x="${botX-shaftW/2}" y="${botEndY-5}" width="${shaftW}" height="${shaftH}" fill="url(#shaftHatch)" stroke="var(--struct)"/>`;
    out+=`<text class="shaft-label" x="${botX+shaftW/2+12}" y="${botEndY+3.5}">LAUNCHING SHAFT</text>`;
  }

  // route line stack: glow → casing → sleepers → core → flows
  out+=`<path class="route-glow" d="${pathD}"/>`;
  out+=`<path d="${pathD}" fill="none" stroke="#04060e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`;
  out+=`<g id="ticks"></g>`;
  out+=`<path id="routePath" d="${pathD}" fill="none" stroke="url(#lineGrad)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(ENABLE_FLOW){
    out+=`<path class="flow flow-a" d="${pathD}"/>`;
    out+=`<path class="flow flow-b" d="${pathD}"/>`;
  }

  // right-side sequence rail
  out+=`<g>`;
  out+=`<line x1="${RAIL_X}" y1="${yOf(0)-20}" x2="${RAIL_X}" y2="${yOf(n-1)+20}" stroke="var(--struct)" stroke-width="1"/>`;
  out+=`<path d="M ${RAIL_X} ${yOf(0)-26} l 4 6 l -4 6 l -4 -6 Z" fill="var(--struct)"/>`;
  out+=`<path d="M ${RAIL_X} ${yOf(n-1)+14} l 4 6 l -4 6 l -4 -6 Z" fill="var(--struct)"/>`;
  DATA.forEach((d,i)=>{
    const y=yOf(i);
    out+=`<line x1="${RAIL_X-5}" y1="${y}" x2="${RAIL_X+5}" y2="${y}" stroke="var(--struct)" stroke-width="1"/>`;
    out+=`<text class="idx" x="${RAIL_X+9}" y="${y+3}">${String(i+1).padStart(2,'0')}</text>`;
  });
  out+=`</g>`;

  // stations
  DATA.forEach((d,i)=>{
    const y=yOf(i), mx=xAtY(vertices,y);
    const col=d.completed?'var(--done)':'var(--pending)';
    const tagW=Math.round(40+d.id.length*9.5+d.name.length*7.6);
    out+=`<line class="connector" x1="${LABEL_X+tagW+6}" y1="${y}" x2="${mx-17}" y2="${y}"/>`;
    out+=`<rect class="tag" x="${LABEL_X}" y="${y-15}" width="${tagW}" height="30" rx="5"/>`;
    out+=`<circle cx="${LABEL_X+13}" cy="${y}" r="2.6" fill="${col}"/>`;
    out+=`<text class="st-id" x="${LABEL_X+21}" y="${y+4}" fill="${col}">${d.id}</text>`;
    out+=`<text class="st-label" x="${LABEL_X+21+d.id.length*9.5+8}" y="${y+4.5}">${d.name}</text>`;
    out+=`<g class="station" style="color:${col}">`;
    if(ENABLE_ORBITS) out+=`<circle class="orbit" cx="${mx}" cy="${y}" r="15.5" stroke="${col}" style="animation-delay:${(-i*1.37).toFixed(2)}s"/>`;
    out+=`<circle class="ping" cx="${mx}" cy="${y}" r="10" stroke="${col}"/>`;
    if(d.completed){
      out+=`<polygon points="${hex(mx,y,11)}" fill="#061410" stroke="${col}" stroke-width="2"/>`;
      out+=`<polygon points="${hex(mx,y,4.2)}" fill="${col}"/>`;
    }else{
      out+=`<polygon points="${hex(mx,y,10.5)}" fill="#0a0e20" stroke="${col}" stroke-width="2"/>`;
      out+=`<circle cx="${mx}" cy="${y}" r="2.6" fill="${col}"/>`;
    }
    out+=`</g>`;
  });

  // metro train (double-cab: auto-reverses at termini)
  out+=`<g id="train" transform="translate(-999 -999)">
    <ellipse class="t-halo" rx="30" ry="16" fill="url(#trainGlow)"/>
    <ellipse class="t-trail" cx="-24" rx="24" ry="8" fill="url(#trailGrad)"/>
    <path class="t-beam" d="M17 -3.5 L38 -8.5 L38 8.5 L17 3.5 Z" fill="url(#beamGrad)"/>
    <rect class="t-body" x="-19" y="-10" width="38" height="20" rx="8.5"/>
    <rect class="t-window" x="-12" y="-3" width="20" height="6" rx="3"/>
    <rect class="t-cab" x="9.5" y="-6.5" width="6.5" height="13" rx="3"/>
    <circle class="t-hl" cx="16.4" cy="-4.4" r="1.7"/>
    <circle class="t-hl" cx="16.4" cy="4.4" r="1.7"/>
    <rect class="t-door" x="-9.5" y="-10.6" width="7" height="3" rx="1"/>
    <rect class="t-door" x="-9.5" y="7.6" width="7" height="3" rx="1"/>
    <rect class="t-door" x="3.5" y="-10.6" width="7" height="3" rx="1"/>
    <rect class="t-door" x="3.5" y="7.6" width="7" height="3" rx="1"/>
  </g>`;

  out+=`</svg>`;
  document.getElementById("svgHolder").innerHTML=out;
}

/* ============================================================
   TRAIN LOOP — moves along the real path, stops at every station
   ============================================================ */
function initAnimations(){
  const pathEl=document.getElementById('routePath');
  const trainEl=document.getElementById('train');
  const readout=document.getElementById('readout');
  const prog=document.getElementById('hudProgress');
  const clockEl=document.getElementById('hudClock');
  const stationEls=[...document.querySelectorAll('#map .station')];
  const pingEls=[...document.querySelectorAll('#map .ping')];
  const L=pathEl.getTotalLength();

  // track sleepers, generated from the actual path geometry
  if(ENABLE_TICKS){
    const g=document.getElementById('ticks'); let h='';
    for(let s=10;s<L-8;s+=26){
      const p=pathEl.getPointAtLength(s);
      const q=pathEl.getPointAtLength(Math.min(L,s+2));
      let tx=q.x-p.x, ty=q.y-p.y; const m=Math.hypot(tx,ty)||1;
      const nx=-ty/m, ny=tx/m;
      h+=`<line x1="${(p.x-nx*6).toFixed(1)}" y1="${(p.y-ny*6).toFixed(1)}" x2="${(p.x+nx*6).toFixed(1)}" y2="${(p.y+ny*6).toFixed(1)}"/>`;
    }
    g.innerHTML=h;
  }

  // arc-length of each station along the path (path y is monotonic → binary search)
  const sAtY=yT=>{ let lo=0,hi=L;
    for(let k=0;k<42;k++){ const mid=(lo+hi)/2;
      if(pathEl.getPointAtLength(mid).y<yT) lo=mid; else hi=mid; }
    return (lo+hi)/2; };
  const sSt=DATA.map((_,i)=>sAtY(yOf(i)));

  // timeline: full pass down (dwell each station) + full pass up, looping forever
  function pass(sign){
    const order=DATA.map((_,i)=>i); if(sign<0) order.reverse();
    const ph=[{type:'dwell',at:order[0],dur:STATION_DWELL_S+0.5}];
    for(let k=0;k<order.length-1;k++){
      const a=sSt[order[k]], b=sSt[order[k+1]];
      ph.push({type:'move',from:a,to:b,dur:Math.max(0.6,Math.abs(b-a)/TRAIN_SPEED_PX_S),next:order[k+1]});
      ph.push({type:'dwell',at:order[k+1],dur:(k===order.length-2?STATION_DWELL_S+0.5:STATION_DWELL_S)});
    }
    return ph;
  }
  const PHASES=pass(1).concat(pass(-1));
  const CYCLE=PHASES.reduce((t,p)=>t+p.dur,0);
  const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;

  let prevPh=null, activeIdx=-1, dir=1, pingJob=null;
  const t0=performance.now();
  const two=x=>String(Math.floor(x)).padStart(2,'0');
  const fmt=t=>`T+${two(t/3600)}:${two((t/60)%60)}:${two(t%60)}`;

  function frame(now){
    const t=((now-t0)/1000)%CYCLE;
    let acc=0, ph=PHASES[PHASES.length-1], local=t;
    for(const p of PHASES){ if(t<acc+p.dur){ph=p; local=t-acc; break;} acc+=p.dur; }

    const moving=ph.type==='move';
    let s;
    if(moving){ const u=ease(local/ph.dur); s=ph.from+(ph.to-ph.from)*u; dir=ph.to>ph.from?1:-1; }
    else s=sSt[ph.at];

    // position + orientation (train is double-ended; scale flip chooses the leading cab)
    const pt=pathEl.getPointAtLength(s);
    const pt2=pathEl.getPointAtLength(Math.min(L,s+1.5));
    const ang=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI;
    trainEl.setAttribute('transform',
      `translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)}) rotate(${ang.toFixed(2)}) scale(${dir>0?1:-1} 1)`);
    trainEl.classList.add('on');
    trainEl.classList.toggle('moving',moving);
    trainEl.classList.toggle('dwell',!moving);

    // phase-change events: station ping, active glow, HUD readout
    if(ph!==prevPh){
      if(prevPh&&prevPh.type==='dwell'&&activeIdx>=0){
        stationEls[activeIdx].classList.remove('active'); activeIdx=-1;
      }
      if(ph.type==='dwell'){
        activeIdx=ph.at; stationEls[ph.at].classList.add('active');
        const pe=pingEls[ph.at]; pe.setAttribute('r','10'); pingJob={el:pe,start:now};
        readout.textContent=`DOORS OPEN ▸ ${DATA[ph.at].name.toUpperCase()}`;
        readout.dataset.mode='dwell';
      }else{
        readout.textContent=`NEXT STOP ▸ ${DATA[ph.next].name.toUpperCase()}`;
        readout.dataset.mode='move';
      }
      prevPh=ph;
    }

    // expanding arrival ring
    if(pingJob){
      const k=(now-pingJob.start)/800;
      if(k>=1){ pingJob.el.setAttribute('opacity','0'); pingJob=null; }
      else{
        pingJob.el.setAttribute('r',(10+k*26).toFixed(1));
        pingJob.el.setAttribute('opacity',(0.9*(1-k)).toFixed(3));
      }
    }

    prog.style.width=((s/L)*100).toFixed(2)+'%';
    clockEl.textContent=fmt((now-t0)/1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

render();
initAnimations();
</script>
